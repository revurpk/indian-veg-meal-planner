<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<title>Veg Meal Planner — Indian Vegetarian Weekly Meal Planner</title>
<meta name="description" content="A weekly meal planner built around quick, nutritious Indian vegetarian recipes — mains, soups, pasta, bread snacks and desserts, with built-in nutrition info and a shopping list.">

<meta name="theme-color" content="#e8590c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meal Planner">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="shortcut icon" href="icons/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <img src="icons/icon.svg" alt="" class="brand-logo">
    <h1>Veg Meal Planner</h1>
  </div>
  <nav class="tabs" id="tabs">
    <button class="tab-btn active" data-view="recipes" type="button">Recipes</button>
    <button class="tab-btn" data-view="planner" type="button">Weekly Planner</button>
    <button class="tab-btn" data-view="shopping" type="button">Shopping List</button>
  </nav>
  <button id="installBtn" class="install-btn" hidden type="button">Install App</button>
</header>

<main>

  <section id="view-recipes" class="view active">
    <div class="search-bar">
      <input id="searchInput" type="search" placeholder="Search recipes or ingredients — try &quot;paneer&quot; or &quot;tomato&quot;…" autocomplete="off">
    </div>
    <div class="filter-row" id="categoryFilters"></div>

    <div class="control-bar">
      <select id="cuisineSelect" class="control-select" aria-label="Cuisine"></select>
      <select id="timeSelect" class="control-select" aria-label="Maximum total time"></select>
      <button id="moreFiltersBtn" class="filter-toggle" type="button" aria-expanded="false" aria-controls="advancedFilters">
        ⚙ More filters <span id="filterBadge" class="filter-badge" hidden>0</span>
      </button>
      <button id="clearFiltersBtn" class="clear-filters" type="button" hidden>Clear all</button>
    </div>

    <div id="advancedFilters" class="advanced-filters" hidden>
      <div class="filter-group">
        <div class="filter-group-title">Meal</div>
        <div class="filter-row" id="mealFilters"></div>
      </div>
      <div class="filter-group">
        <div class="filter-group-title">Good for</div>
        <div class="filter-row" id="tagFilters"></div>
      </div>
    </div>

    <p id="resultCount" class="result-count"></p>
    <div id="recipeGrid" class="recipe-grid"></div>
    <p id="noResults" class="empty-state" hidden>No recipes match your search — try a different ingredient or clear the filters.</p>
  </section>

  <section id="view-planner" class="view">
    <div class="planner-toolbar no-print">
      <div id="weekNutritionSummary" class="week-summary"></div>
      <div class="toolbar-actions">
        <button id="exportPlanner" class="ghost-btn" type="button">⬇ Export</button>
        <button id="printPlanner" class="ghost-btn" type="button">🖨 Print</button>
        <button id="clearPlanner" class="ghost-btn" type="button">Clear week</button>
      </div>
    </div>
    <div id="plannerGrid" class="planner-grid"></div>
  </section>

  <section id="view-shopping" class="view">
    <div class="shopping-toolbar no-print">
      <p class="hint">Aggregated from every recipe in your weekly plan.</p>
      <div class="toolbar-actions">
        <button id="exportShopping" class="ghost-btn" type="button">⬇ Export</button>
        <button id="printShopping" class="ghost-btn" type="button">🖨 Print</button>
        <button id="clearShoppingChecks" class="ghost-btn" type="button">Uncheck all</button>
      </div>
    </div>
    <div id="shoppingList" class="shopping-list"></div>
    <p id="shoppingEmpty" class="empty-state" hidden>Your weekly plan is empty — add recipes from the Planner tab to build a shopping list.</p>
  </section>

</main>

<!-- Recipe detail modal -->
<div id="recipeModal" class="modal-overlay" hidden>
  <div class="modal">
    <button class="modal-close" id="closeModalBtn" type="button" aria-label="Close">✕</button>
    <div id="modalBody" class="modal-body"></div>
  </div>
</div>

<!-- Add-to-plan day/slot picker (opened from recipe detail) -->
<div id="planPicker" class="modal-overlay" hidden>
  <div class="modal modal-small">
    <button class="modal-close" id="closePlanPickerBtn" type="button" aria-label="Close">✕</button>
    <h3>Add to weekly plan</h3>
    <div id="planPickerBody" class="plan-picker-body"></div>
  </div>
</div>

<!-- Recipe chooser (opened from an empty planner cell) -->
<div id="cellPicker" class="modal-overlay" hidden>
  <div class="modal">
    <button class="modal-close" id="closeCellPickerBtn" type="button" aria-label="Close">✕</button>
    <h3 id="cellPickerTitle">Choose a recipe</h3>
    <input id="cellPickerSearch" type="search" placeholder="Search recipes…" autocomplete="off" class="cell-picker-search">
    <div id="cellPickerGrid" class="recipe-grid recipe-grid-compact"></div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="js/ingredients.js"></script>
<script src="js/recipes.js"></script>
<script src="js/app.js"></script>
</body>
</html>
